<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tileable accounting-ledger column grid: faint cream hairlines on transparent, 5% opacity -->
  <g stroke="#F6F1E4" stroke-opacity="0.05" stroke-width="1">
    <!-- vertical ledger columns -->
    <line x1="0" y1="0" x2="0" y2="400"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="220" y1="0" x2="220" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="330" y1="0" x2="330" y2="400"/>
    <line x1="380" y1="0" x2="380" y2="400"/>
    <!-- horizontal entry rows -->
    <line x1="0" y1="0" x2="400" y2="0"/>
    <line x1="0" y1="25" x2="400" y2="25"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="125" x2="400" y2="125"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="175" x2="400" y2="175"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="275" x2="400" y2="275"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="325" x2="400" y2="325"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="0" y1="375" x2="400" y2="375"/>
  </g>
  <!-- header rule + double underline, classic ledger touch -->
  <g stroke="#F6F1E4" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="245" x2="400" y2="245"/>
  </g>
  <!-- debit/credit double rules on amount columns -->
  <g stroke="#F6F1E4" stroke-opacity="0.08" stroke-width="1">
    <line x1="218" y1="0" x2="218" y2="400"/>
    <line x1="222" y1="0" x2="222" y2="400"/>
    <line x1="278" y1="0" x2="278" y2="400"/>
    <line x1="282" y1="0" x2="282" y2="400"/>
  </g>
</svg>
