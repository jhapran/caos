<svg width="240" height="64" viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CAOS">
  <!-- Monogram tile: rounded-square deep evergreen with stylized open ledger forming C/A -->
  <rect x="4" y="8" width="48" height="48" rx="10" fill="#0E5F52"/>
  <rect x="4" y="8" width="48" height="48" rx="10" stroke="#B7791F" stroke-opacity="0.55" stroke-width="1"/>
  <!-- open ledger: two page slabs -->
  <path d="M28 20 L14 24 V44 L28 40 V20 Z" fill="#F6F1E4" fill-opacity="0.92"/>
  <path d="M28 20 L42 24 V44 L28 40 V20 Z" fill="#F6F1E4" fill-opacity="0.72"/>
  <line x1="28" y1="20" x2="28" y2="40" stroke="#0E5F52" stroke-width="1.4"/>
  <!-- ledger ruling lines -->
  <line x1="17" y1="28" x2="25" y2="26.4" stroke="#0E5F52" stroke-opacity="0.55" stroke-width="1"/>
  <line x1="17" y1="32.5" x2="25" y2="30.9" stroke="#0E5F52" stroke-opacity="0.55" stroke-width="1"/>
  <line x1="31" y1="26.4" x2="39" y2="28" stroke="#0E5F52" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="31" y1="30.9" x2="39" y2="32.5" stroke="#0E5F52" stroke-opacity="0.45" stroke-width="1"/>
  <!-- stylized C/A inside pages -->
  <path d="M23.4 34.6 a3.1 3.1 0 1 1 0.4-4.4" stroke="#0E5F52" stroke-width="1.6" stroke-linecap="round" fill="none" transform="skewY(-6) translate(0 3.4)"/>
  <path d="M35.5 29.2 L32.6 36.4 M35.5 29.2 L38.4 36.9 M33.6 34.2 L37.4 34.8" stroke="#0E5F52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Wordmark -->
  <text x="66" y="41" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="4" fill="#F6F5F1">CAOS</text>
  <!-- thin gold underline beneath the wordmark -->
  <rect x="67" y="47" width="98" height="2" rx="1" fill="#B7791F"/>
</svg>
